<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Help Desk</title>
</head>
    <a href="http://www.swin.edu.au" target="_blank">
    <img src="swin_logo.png" alt="Swinburne University of Technology">
</a>
<h1>CWA Help Desk Appointment</h1>
<p>The Help Desk is located in ATC620. Open 10:30 to 19:00 Monday to Friday</p>
<p>Check Blackboard for when CWA tutors will be there.</p>
<form>
     <fieldset>
        <legend>Student details</legend>

        <label>Student ID</label>
        <input type="text">

        <br><br>

        <label>Given Name</label>
        <input 
        type="text"
        maxlength="15"
        required= "required"
        pattern="[A-Za-z]+"
        >

        <label>Family Name</label>
        <input type="text"
        id="familyname"
        maxlength="15"
        required="required"
        pattern="[A-Za-z]+"
        >
    
</fieldset>


    <fieldset>
        <legend>Your unit</legend>

        <input type="radio" name="unit"> COS10011
        <input type="radio" name="unit"> COS60004
        <input type="radio" name="unit"> COS60007
        <br><br>

        <label>Your Tutor</label>

        <select>
            <option>Please Select</option>
            <option>Tutor 1</option>
            <option>Tutor 2</option>
            <option>Tutor 3</option>
        </select>

    </fieldset>
    <fieldset>
        <legend>Issue</legend>
 <p>
        <label for="html">HTML</label>
        <input type="checkbox" id="html" name="issue[]" value="HTML" checked="checked">
        <label for="css">CSS</label>
        <input type="checkbox" id="css" name="issue[]" value="CSS">
        <label for="js">JavaScript</label>
        <input type="checkbox" id="js" name="issue[]" value="JavaScript">
        <label for="php">PHP</label>
        <input type="checkbox" id="php" name="issue[]" value="PHP">
        <label for="mysql">MySQL</label>
        <input type="checkbox" id="mysql" name="issue[]" value="MySQL">
      </p>
       <p>
        <label for="description">Description of Issue</label><br>
        <textarea id="description" name="description" rows="5" cols="40"
                  placeholder="Write description of your problem here..."></textarea>
      </p>

    </fieldset>


    <fieldset>
        <legend>Preferred Date / Time</legend>

        <label>Date</label>
        <input type="text" placeholder="dd/mm/yyyy">

        <br>

        <label>Time</label>
        <input type="text" placeholder="00:00">

    </fieldset>
 <button type="submit">Book</button>
    <button type="reset">Reset form</button>
</form>

<body>

</body>
</html>
